<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
  <title>Keuangan Keluarga</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background: #0f172a;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      /* KUNCI BUG: sebelumnya halaman ini (pembungkus iframe) bisa ikut ter-scroll di HP kalau
         tinggi iframe di dalamnya meleset lebih tinggi dari layar (lihat catatan di
         .app-wrapper). Dengan overflow:hidden di sini, halaman luar TIDAK PERNAH scroll --
         yang scroll cuma konten di DALAM app (sudah diatur di index.html Apps Script-nya). */
      overflow: hidden;
      overscroll-behavior: none;
    }

    /* Wrapper agar rasio mobile terlihat rapi juga saat dibuka di desktop */
    .app-wrapper {
      max-width: 480px;
      margin: 0 auto;
      /* KUNCI BUG "floating menu hilang di HP": 100vh di banyak browser HP dihitung seolah
         address bar sudah collapse (lebih tinggi dari layar yang BENAR-BENAR terlihat saat
         halaman baru dibuka). Karena iframe di dalamnya height:100%, iframe pun ikut lebih
         tinggi dari layar -- tombol +/menu di bagian bawah app jadi terdorong ke bawah layar
         (kelihatannya "hilang", padahal cuma butuh scroll turun). 100dvh mengikuti tinggi
         layar yang benar-benar terlihat, dan --app-vh (dihitung via JS di bawah) jadi
         cadangan untuk browser/webview lama yang belum kenal dvh. */
      height: 100vh;
      height: 100dvh;
      height: var(--app-vh, 100dvh);
      background: #f4f6fb;
      box-shadow: 0 0 40px rgba(0,0,0,0.4);
      position: relative;
      overflow: hidden;
    }

    iframe#appFrame {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Loading overlay ditampilkan sampai iframe selesai load */
    #loadingOverlay {
      position: absolute;
      inset: 0;
      background: #f4f6fb;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      transition: opacity 0.3s ease;
    }
    #loadingOverlay.hide {
      opacity: 0;
      pointer-events: none;
    }
    .spinner {
      width: 34px;
      height: 34px;
      border: 3px solid #e5e7eb;
      border-top: 3px solid #2563eb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    #loadingOverlay p {
      color: #6b7280;
      font-size: 13px;
      margin: 0;
    }
  </style>
</head>
<body>
  <script>
    // Cadangan untuk browser/webview HP yang belum dukung 100dvh dengan baik (lihat catatan
    // di CSS .app-wrapper). Menghitung tinggi layar yang BENAR-BENAR terlihat lalu simpan
    // sebagai CSS variable --app-vh.
    (function () {
      function setAppVH() {
        var h = (window.visualViewport && window.visualViewport.height) ||
                window.innerHeight ||
                document.documentElement.clientHeight;
        document.documentElement.style.setProperty('--app-vh', h + 'px');
      }
      setAppVH();
      window.addEventListener('resize', setAppVH);
      window.addEventListener('orientationchange', setAppVH);
      if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', setAppVH);
        window.visualViewport.addEventListener('scroll', setAppVH);
      }
    })();
  </script>

  <div class="app-wrapper">
    <div id="loadingOverlay">
      <div class="spinner"></div>
      <p>Memuat aplikasi keuangan keluarga...</p>
    </div>

    <!--
      GANTI URL DI BAWAH INI dengan Web App URL hasil Deploy dari Apps Script Anda.
      Contoh: https://script.google.com/macros/s/AKfycb.../exec
    -->
    <iframe
      id="appFrame"
      src="https://script.google.com/macros/s/AKfycbwcmceMpDnQ0aAY72zfIbRSK8kJkm7tCoTH1eAV71UpYU1889ikJ0JLakKyNbCt_ByMQg/exec"
      title="Aplikasi Keuangan Keluarga"
      allow="clipboard-write"
      onload="document.getElementById('loadingOverlay').classList.add('hide')">
    </iframe>
  </div>

</body>
</html>
